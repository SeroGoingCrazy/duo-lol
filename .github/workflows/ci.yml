# pytest (on SQLite and on Postgres), type check and the Playwright end-to-end run on every push and pull request.
# Uses the synthetic data in data/fake_riot.py, so no Riot key or secret is needed.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:   # the Python tests run a second time on Postgres, as in production (Neon)
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          DUO_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - run: npx playwright test --config playwright.ui.config.ts
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results

  # After the tests pass on main, ship the Python API to Fly (docs/deploy.md §1). The website deploys
  # itself through Vercel's Git integration. Skipped until the FLY_API_TOKEN repo secret is set.
  deploy-api:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy-api   # one deploy at a time; a newer push waits for the running one
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only --app duo-lol-api
        if: env.FLY_API_TOKEN != ''
