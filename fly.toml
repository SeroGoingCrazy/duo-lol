# Python API on Fly.io (docs/deploy.md). `fly launch --no-deploy` once, then `fly deploy`.
app = "duo-lol-api"
primary_region = "iad"   # US East, next to Neon and the NA players

[build]

[env]   # the database is the DATABASE_URL secret (Neon)
  DUO_SCORE_SCALE = "/data/score_scale.json"

[mounts]
  source = "duo_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # one machine always on: lookups run as in-memory jobs, and stopping would drop them
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
