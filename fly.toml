# Python API on Fly.io (docs/deploy.md). `fly launch --no-deploy` once, then `fly deploy`.
app = "duo-lol-api"
primary_region = "iad"   # US East, next to Neon and the NA players

[build]

[env]
  DUO_DB = "/data/lol_duo.sqlite"
  DUO_SCORE_SCALE = "/data/score_scale.json"

[mounts]
  source = "duo_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
