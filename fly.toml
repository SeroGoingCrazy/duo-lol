# Python API on Fly.io (docs/deploy.md). `fly launch --no-deploy` once, then `fly deploy`.
app = "duo-lol-api"
primary_region = "iad"   # US East, next to Neon and the NA players

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # one machine always on: lookups run as in-memory jobs, and stopping would drop them
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Fly restarts the machine when this fails; /health skips the database, so a Neon cold start does not count.
[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
